name: Bug report
description: Report an unexpected behavior in Physical AI.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Please complete the sections that are relevant. You can leave irrelevant sections blank.

  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Describe the observed behavior, expected result, and a minimal reproduction.
      value: |
        ## What happened?

        ## What did you expect?

        ## Steps to reproduce
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only the details relevant to this issue.
      value: |
        - Studio or Runtime version/commit:
        - OS:
        - Python:
        - Robot/camera:
        - Hardware accelerator:
        - Policy/export backend:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Remove secrets and personal information before posting logs.
      render: shell
    validations:
      required: false
