name: OV Smoke

on:
  push:
    branches:
      - main
    paths:
      - "src/physicalai/inference/**"
      - "pyproject.toml"
      - "tests/integration/inference/test_ov_smoke.py"
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run full coverage (all models, all stages)"
        type: boolean
        default: false

permissions: {}

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - src/physicalai/inference/**
              - pyproject.toml
              - tests/integration/inference/test_ov_smoke.py
              - .github/workflows/ov-smoke.yml
              - '!**/*.md'
              - '!**/docs/**'

  ov-smoke:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth 2 lets us compare HEAD~1 for push events to detect
          # which files actually changed within the triggering commit.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.5

      - name: Install dependencies
        run: uv sync --frozen --extra tests

      # Determine whether to run in full mode.
      # Full mode is used when:
      #   - workflow_dispatch with inputs.full=true, OR
      #   - test_ov_smoke.py itself changed (e.g. model revision SHAs updated).
      #
      # Detecting the changed file avoids a hard dependency on a third-party
      # paths-filter action: for pull_request events we diff against the PR
      # base; for push events we diff HEAD~1..HEAD.
      - name: Detect if smoke spec was modified
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          SPEC="tests/integration/inference/test_ov_smoke.py"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "full=$INPUT_FULL" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git diff --name-only "$PR_BASE_SHA" HEAD -- "$SPEC" | grep -q .; then
              echo "full=true" >> "$GITHUB_OUTPUT"
            else
              echo "full=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # push event — compare with the commit before this push
            if git diff --name-only HEAD~1 HEAD -- "$SPEC" | grep -q .; then
              echo "full=true" >> "$GITHUB_OUTPUT"
            else
              echo "full=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Cache key is derived from the content of the smoke spec itself so that
      # updating the pinned revision SHAs automatically invalidates the cache
      # and forces a fresh download of the new model artifacts.
      - name: Restore HF model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ov-smoke-hf-${{ runner.os }}-${{ hashFiles('tests/integration/inference/test_ov_smoke.py') }}
          restore-keys: |
            ov-smoke-hf-${{ runner.os }}-

      - name: Run OV smoke tests
        env:
          OV_SMOKE_CACHE_DIR: ~/.cache/huggingface
          OV_SMOKE_FULL: ${{ steps.detect.outputs.full == 'true' && '1' || '' }}
        run: uv run pytest -m ov_smoke -s --log-cli-level=INFO

  required-check:
    name: Required Check ov-smoke
    needs:
      - check-paths
      - ov-smoke
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
