# Fuzzing for Physical AI Runtime

name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration_s:
        description: "Fuzzing duration per target (seconds)"
        default: "1800"
        required: false
  pull_request:

permissions: {}

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - tests/fuzz/**
              - src/**
              - .github/workflows/fuzz.yml
              - '!**/*.md'
              - '!**/docs/**'

  fuzz:
    name: "fuzz / ${{ matrix.harness }}"
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Manifest / component instantiation
          - harness: manifest
            seed_dir: tests/fuzz/seeds/fuzz_manifest
          - harness: component
            seed_dir: ""
          # Array processing pipeline
          - harness: stats_normalizer
            seed_dir: ""
          - harness: resize_preprocessor
            seed_dir: ""
          - harness: action_normalizer
            seed_dir: ""
          - harness: action_chunk_trimmer
            seed_dir: ""
          - harness: lerp_smoother
            seed_dir: ""
          - harness: resize_smolvla
            seed_dir: ""
          # Path handling, runtime, queue
          - harness: policy_name
            seed_dir: ""
          - harness: detect_backend
            seed_dir: ""
          - harness: prepare_inputs
            seed_dir: ""
          - harness: action_queue
            seed_dir: ""
          - harness: import_dotted_path
            seed_dir: ""

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.8"

      - name: Install project dependencies
        run: uv sync --frozen

      # TODO: move atheris into pyproject.toml
      - name: Install atheris
        run: uv pip install "atheris==3.1.0"

      - name: Seed corpus
        run: |
          mkdir -p "tests/fuzz/corpus/${{ matrix.harness }}"
          if [ -n "${{ matrix.seed_dir }}" ] && [ -d "${{ matrix.seed_dir }}" ]; then
            cp -rn "${{ matrix.seed_dir }}/." "tests/fuzz/corpus/${{ matrix.harness }}/" || true
          fi

      # ── Fuzzing run ───────────────────────────────────────────────────────
      - name: Run fuzzer
        id: run_fuzzer
        env:
          FUZZ_DURATION: >-
            ${{
              github.event_name == 'pull_request' && '30' ||
              github.event.inputs.duration_s || '1800'
            }}
          # Dump the Python stack trace on crashes.
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          uv run python "tests/fuzz/harnesses/fuzz_${{ matrix.harness }}.py" \
            "tests/fuzz/corpus/${{ matrix.harness }}/" \
            -max_total_time="${FUZZ_DURATION}" \
            -max_len=65536 \
            -timeout=30 \
            -rss_limit_mb=2048 \
            -print_final_stats=1 \
            2>&1 | tee "fuzz_output_${{ matrix.harness }}.txt"
        timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 360 }}

      # ── Crash detection ───────────────────────────────────────────────────
      # libFuzzer writes four artifact types to the working directory:
      #   crash-*      uncaught exception or assert
      #   timeout-*    single input exceeded -timeout
      #   oom-*        process exceeded -rss_limit_mb
      #   slow-unit-*  input exceeded report_slow_units threshold
      - name: Detect crashes
        if: always()
        id: crash_check
        run: |
          mapfile -t crashes < <(find . -maxdepth 1 \
            \( -name 'crash-*' -o -name 'timeout-*' \
               -o -name 'oom-*' -o -name 'slow-unit-*' \) \
            -print)
          if [ ${#crashes[@]} -gt 0 ]; then
            echo "crashes_found=true" >> "$GITHUB_OUTPUT"
            printf '::error::Crash artifacts found for %s:\n' "${{ matrix.harness }}"
            printf '  %s\n' "${crashes[@]}"
          else
            echo "crashes_found=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Artifact uploads ──────────────────────────────────────────────────
      # Clean run       → zero artifacts.
      # libFuzzer crash → crash artifact (reproducing inputs + log).
      # Startup failure → diagnostic log (fuzzer exited non-zero, no crash files written;
      #                   happens for import errors, NameError at module level, etc.).
      - name: Upload crash artifacts
        if: ${{ always() && steps.crash_check.outputs.crashes_found == 'true' }}
        id: upload_crashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashes-${{ matrix.harness }}-${{ github.run_id }}
          path: |
            crash-*
            timeout-*
            oom-*
            slow-unit-*
            fuzz_output_${{ matrix.harness }}.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostic log
        if: >-
          ${{    
            always() &&
            steps.crash_check.outputs.crashes_found != 'true' &&
            steps.run_fuzzer.conclusion == 'failure'
          }}
        id: upload_log_diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-${{ matrix.harness }}-${{ github.run_id }}
          path: fuzz_output_${{ matrix.harness }}.txt
          if-no-files-found: warn
          retention-days: 7

      # ── Fail the job ──────────────────────────────────────────────────────
      - name: Fail on crashes or startup failure
        if: ${{ always() && (steps.run_fuzzer.conclusion == 'failure' || steps.crash_check.outputs.crashes_found == 'true') }}
        env:
          CRASHES_FOUND: ${{ steps.crash_check.outputs.crashes_found }}
          HARNESS: ${{ matrix.harness }}
        run: |
          if [ "$CRASHES_FOUND" == "true" ]; then
            echo "::error::Crashes detected in ${HARNESS} — see crash artifacts"
          else
            echo "::error::Fuzzer exited non-zero without crash files in ${HARNESS} — startup failure, see diagnostic log"
          fi
          exit 1

  required-check:
    name: Required Check fuzz
    needs:
      - check-paths
      - fuzz
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
