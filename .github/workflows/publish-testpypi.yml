name: Publish TestPyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: packages
        run: |
          echo "matrix=$(jq -c '[.packages | to_entries[] | {name: .value["package-name"], path: .key}]' .github/release-please-config.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 0 # needed for hatch-vcs to resolve version from git tags

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set version suffix for TestPyPI
        working-directory: ${{ matrix.package.path }}
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          if [ "${PACKAGE_PATH}" = "." ]; then
            TAG_PREFIX="v"
          else
            TAG_PREFIX="${PACKAGE_NAME}-v"
          fi
          VERSION=$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname | head -n 1 | sed "s/^${TAG_PREFIX}//" || true)
          if [ -z "${VERSION}" ]; then
            VERSION="0.0.0"
          fi
          DEV_VERSION="${VERSION}.dev$(date -u +%Y%m%d%H%M%S)"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${DEV_VERSION}" >> $GITHUB_ENV

      - name: Build distributions
        working-directory: ${{ matrix.package.path }}
        run: python -m pip install build==1.5.0 twine==7.0.0 && python -m build && python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package.name }}-testpypi-dist
          path: ${{ matrix.package.path }}/dist/

  smoke-test:
    name: Smoke test ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: [packages, build]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package.name }}-testpypi-dist
          path: dist/

      - name: Download all distributions for dependency resolution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-testpypi-dist"
          merge-multiple: true
          path: all-dist/

      - name: Verify clean wheel install
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --find-links all-dist dist/*.whl
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata

          import_name = "${{ matrix.package.name }}".replace("-", "_")
          __import__(import_name)

          print(metadata.version("${{ matrix.package.name }}"))
          PY

  publish:
    name: Publish ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: [packages, smoke-test]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.matrix) }}
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ matrix.package.name }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package.name }}-testpypi-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
