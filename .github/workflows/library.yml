name: Library

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_lint: ${{ steps.check_paths_lint.outputs.run }}
      run_tests: ${{ steps.check_paths_tests.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # prek lints nearly every tracked file (python, yaml, json, markdown,
      # workflows, skills), so only exclude paths no hook ever touches.
      - name: Check lint paths
        id: check_paths_lint
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - '**'
              - '!docs/assets/**'
              - '!CHANGELOG.md'

      - name: Check test paths
        id: check_paths_tests
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - src/**
              - tests/**
              - pyproject.toml
              - uv.lock
              - .github/workflows/library.yml

  code-quality:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_lint == 'true'
    permissions:
      contents: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &set-up-python
        name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.0"
          extra-args: --all-files

  unit-tests:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - *checkout

      - *set-up-python

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.8"

      - name: Install dependencies
        run: uv sync --frozen --extra tests --extra robots --extra transport

      - name: Run python unit tests
        run: uv run pytest tests/unit

  required-check:
    name: Required Check library
    needs:
      - check-paths
      - code-quality
      - unit-tests
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
