name: Library

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      rosbag_studio_smoke:
        description: Run the pinned Studio import and CPU training smoke test
        type: boolean
        default: false

permissions: {}

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_lint: ${{ steps.check_paths_lint.outputs.run }}
      run_tests: ${{ steps.check_paths_tests.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # prek lints nearly every tracked file (python, yaml, json, markdown,
      # workflows, skills), so only exclude paths no hook ever touches.
      - name: Check lint paths
        id: check_paths_lint
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - '**'
              - '!docs/assets/**'
              - '!CHANGELOG.md'

      - name: Check test paths
        id: check_paths_tests
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - src/**
              - tests/**
              - packages/**/src/**
              - packages/**/tests/**
              - packages/physicalai-rosbag-plugin/examples/**
              - packages/**/urdf/**
              - packages/**/pyproject.toml
              - .gitattributes
              - pyproject.toml
              - uv.lock
              - .github/workflows/library.yml

  code-quality:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_lint == 'true'
    permissions:
      contents: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &set-up-python
        name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "v0.5.5"
          extra-args: --all-files

  unit-tests:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository and model assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - *set-up-python

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.8"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-packages --extra tests --extra robots --extra transport
          # The LeRobot plugin is intentionally excluded from the default UV
          # workspace in pyproject.toml so regular `uv sync` does not pull in
          # heavy torch/CUDA dependencies. This test job still runs
          # `packages/*/tests`, so we install LeRobot + the plugin explicitly.
          # `--no-deps` keeps the workspace's editable studio plugin instead of
          # replacing it with an older published SDK.
          uv pip install --python .venv/bin/python lerobot pytest-anyio
          uv pip install --python .venv/bin/python --no-deps -e packages/physicalai-lerobot-plugin

      # The MuJoCo plugin downloads its robot models from MuJoCo Menagerie. The
      # plugin pins the mujoco-menagerie version, which fixes every model file,
      # and its profiles choose the models `prefetch` downloads, so both key the cache.
      - name: Restore MuJoCo Menagerie cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/menagerie-cache
          key: menagerie-${{ runner.os }}-${{ hashFiles('packages/physicalai-mujoco-plugin/pyproject.toml', 'packages/physicalai-mujoco-plugin/src/physicalai_mujoco_plugin/profiles/*.py') }}
          restore-keys: |
            menagerie-${{ runner.os }}-

      - name: Fetch MuJoCo Menagerie models
        env:
          MENAGERIE_CACHE_DIR: ${{ runner.temp }}/menagerie-cache
        run: uv run physicalai-mujoco prefetch

      - name: Run python unit tests
        env:
          MENAGERIE_CACHE_DIR: ${{ runner.temp }}/menagerie-cache
        run: |
          plugin_tests=()
          for path in packages/*/tests; do
            if [[ "$path" != "packages/physicalai-rosbag-plugin/tests" ]]; then
              plugin_tests+=("$path")
            fi
          done
          uv run pytest --import-mode=importlib tests/unit "${plugin_tests[@]}"

      # Every supported MuJoCo robot profile in its default scene, and every arm's reach (no rendering), on the cached models.
      - name: Run MuJoCo profile smoke matrix and reachability checks
        env:
          MENAGERIE_CACHE_DIR: ${{ runner.temp }}/menagerie-cache
        run: uv run pytest --import-mode=importlib -m mujoco_smoke packages/physicalai-mujoco-plugin/tests

  rosbag-tests:
    name: ROS bag converter (Python 3.12, CPU)
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - *checkout
      - *set-up-python
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install isolated converter dependencies
        run: |
          uv venv --python 3.12 .venv-rosbag
          uv pip install --no-sources --python .venv-rosbag/bin/python -e . -e 'packages/physicalai-rosbag-plugin[tests]' 'torch==2.11.0+cpu' 'torchvision==0.26.0+cpu' --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          uv pip check --python .venv-rosbag/bin/python
      - name: Test converter and CLI
        run: |
          uv run --no-project --python .venv-rosbag/bin/python python -m pytest --import-mode=importlib -q packages/physicalai-rosbag-plugin/tests
          .venv-rosbag/bin/physicalai rosbag --help
          .venv-rosbag/bin/pyrefly check --config packages/physicalai-rosbag-plugin/pyproject.toml
      - name: Build release artifacts
        run: uv build packages/physicalai-rosbag-plugin --out-dir dist/rosbag

  rosbag-studio-smoke:
    name: ROS bag Studio integration (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.rosbag_studio_smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout
      - *set-up-python
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run pinned Studio integration
        run: bash packages/physicalai-rosbag-plugin/examples/studio_smoke.sh "$RUNNER_TEMP/rosbag-studio"

  required-check:
    name: Required Check library
    needs:
      - check-paths
      - code-quality
      - unit-tests
      - rosbag-tests
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
