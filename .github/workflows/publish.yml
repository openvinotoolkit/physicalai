name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and tags
      pull-requests: write # Needed to create release PRs
    outputs:
      released_packages: ${{ steps.release-outputs.outputs.released_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release-please
        if: github.event_name == 'push'
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main

      - id: release-outputs
        env:
          RELEASE_PLEASE_OUTPUTS: ${{ github.event_name == 'push' && toJSON(steps.release-please.outputs) || '{}' }}
        run: |
          # release-please output for physicalai (the root package):
          # {"release_created":"true","tag_name":"v0.1.2"}
          #
          # release-please output for physicalai-studio-plugin:
          # {"packages/physicalai-studio-plugin--release_created":"true",
          #  "packages/physicalai-studio-plugin--tag_name":"physicalai-studio-plugin-v0.1.1"}
          #
          # Normalize release-please outputs into matrix entries consumed by
          # downstream jobs and keep only released packages.

          echo "released_matrix=$(jq -cn \
            --argjson packages "$(jq -c '.packages' .github/release-please-config.json)" \
            --argjson releases "$RELEASE_PLEASE_OUTPUTS" \
            '[
              $packages | to_entries[] | . as $package |
              {
                name: $package.value["package-name"],
                path: $package.key,
                release_created: (
                  if $package.key == "." then
                    $releases.release_created
                  else
                    $releases["\($package.key)--release_created"]
                  end // "false"
                ),
                tag_name: (
                  if $package.key == "." then
                    $releases.tag_name
                  else
                    $releases["\($package.key)--tag_name"]
                  end // ""
                )
              }
              | select(.release_created == "true")
            ]')" >> "$GITHUB_OUTPUT"

      - name: Debug released_packages
        env:
          RELEASED_MATRIX: ${{ steps.release-outputs.outputs.released_matrix }}
        run: |
          echo "released_packages: $RELEASED_MATRIX"

  build:
    name: Build ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released_packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.released_packages) }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.tag_name }}
          lfs: true
          persist-credentials: false
          fetch-depth: 0 # needed for hatch-vcs to resolve version from git tags

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        working-directory: ${{ matrix.package.path }}
        run: python -m pip install build==1.5.0 twine==7.0.0 && python -m build && python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package.name }}-dist
          path: ${{ matrix.package.path }}/dist/

  smoke-test:
    name: Smoke test ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: needs.release-please.outputs.released_packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.released_packages) }}
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package.name }}-dist
          path: dist/

      - name: Download all distributions for dependency resolution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-dist"
          merge-multiple: true
          path: all-dist/

      - name: Verify clean wheel install
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --find-links all-dist dist/*.whl
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata

          import_name = "${{ matrix.package.name }}".replace("-", "_")
          __import__(import_name)
          print(metadata.version("${{ matrix.package.name }}"))
          PY

  publish:
    name: Publish ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: [release-please, smoke-test]
    if: needs.release-please.outputs.released_packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.released_packages) }}
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package.name }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package.name }}-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
