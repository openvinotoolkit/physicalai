  <text x="930" y="755" class="small">Floor reference: tabletop 750 high → RGB optical centre 1650 above floor.</text>
  <text x="930" y="786" class="small">Adjust optical height 800–1000. Re-aim at the same marked target after height changes.</text>
  <rect x="915" y="820" width="715" height="225" rx="10" fill="#f3f6f8" stroke="#ccd6dc"/>
  <text x="935" y="856" class="label">CAMERA TARGETS (mm)</text>
  <text x="935" y="892" class="small">A eye (−170, +680, 900) → aim (450, 0, 50)</text>
  <text x="935" y="925" class="small">B eye (+830, −800, 900) → aim (450, −200, 50)</text>
  <text x="935" y="958" class="small">Both: level image, nominal D435 RGB vertical FOV 42°.</text>
  <text x="935" y="991" class="small">No long boom required. Compensate actual clamp/head-to-RGB offsets.</text>
  <text x="935" y="1021" class="small">Viser: Shoulder or Front. One overview stream; user chooses the POV.</text>
  <line x1="55" y1="1080" x2="1625" y2="1080" stroke="#c1cbd1"/>
  <text x="55" y="1115" class="small">DIMENSIONS CONTROL; NOT TO SCALE WHEN PRINTED. Single table-mounted FR3 only, not a tilted Duo base.</text>
  <text x="55" y="1143" class="small">Rear pole is within potential arm reach. Validate pole/cable clearance, clamp stability and real RGB calibration before any hardware motion.</text>
  <text x="55" y="1171" class="small">Wrist: D435-class camera on Franka's dedicated Hand bracket; exact wrist optical transform still requires calibration. Setup target v1 · 2026-10-23</text>
