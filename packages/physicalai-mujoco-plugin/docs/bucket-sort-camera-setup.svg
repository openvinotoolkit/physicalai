  <line x1="1000" y1="628" x2="1230.05" y2="628" class="dimension"/>
  <text x="1115" y="660" text-anchor="middle" class="small">920 horizontal run</text>
  <line x1="1390" y1="628" x2="1567.55" y2="628" class="dimension"/>
  <text x="1480" y="660" text-anchor="middle" class="small">710 horizontal run</text>
