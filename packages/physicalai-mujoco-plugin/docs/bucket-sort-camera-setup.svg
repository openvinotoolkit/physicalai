<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188" role="img" aria-labelledby="title desc">
  <title id="title">bucket_sort: reproducible table-clamped D435 camera setup</title>
  <desc id="desc">Dimensioned top view and line-of-sight elevations for a single Franka FR3, rear and front table-edge cameras, nominal optical-centre height 900 mm. Dimensions control; not a structural or safety-certified mounting drawing.</desc>
  <metadata>{"units":"m","frame":"single FR3 base on tabletop; +X into workspace, +Y robot left, +Z up","table_x_m":[-0.17,0.83],"table_y_m":[-0.9,0.9],"tabletop_height_m":0.75,"tabletop_thickness_m":0.04,"nominal_rgb_vfov_deg":42,"cameras":{"shoulder":{"eye_m":[-0.17,0.68,0.9],"aim_m":[0.45,0,0.05]},"front":{"eye_m":[0.83,-0.8,0.9],"aim_m":[0.45,-0.2,0.05]}}}</metadata>
