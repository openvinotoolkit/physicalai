# reBot B601-DM read-joints runtime config.
#
# Reads and logs joint positions while holding the current pose. Run from the
# repo root with:
#
#   uv run physicalai run --config packages/physicalai-rebot-b601-plugin/examples/runtime/read-joints-dm.yaml

runtime:
  robot:
    class_path: physicalai_rebot_b601_plugin.dm.ReBotB601DM
    init_args:
      port: /dev/ttyACM0 # CHANGE_ME: follower serial port (or CAN channel)
      can_adapter: damiao # damiao | socketcan
      # POS_VEL / FORCE_POS (default) provides conservative velocity- and
      # force-limited control. Switch both modes to mit only after validating
      # the gains for this arm.
      control_mode: pos_vel # pos_vel | mit
      gripper_control_mode: force_pos # force_pos | mit

  action_source:
    class_path: physicalai_rebot_b601_plugin.motion.HoldPoseSource

  callbacks:
    - class_path: physicalai_rebot_b601_plugin.motion.JointLogger
      init_args:
        throttle_steps: 1

  fps: 10

run:
  duration_s: 30
