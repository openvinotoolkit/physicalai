# reBot B601-DM sinusoidal motion runtime config (move_joints).
#
# Drives every joint through a sine wave as an actuation smoke test. Run from
# the repo root with:
#
#   uv run physicalai run --config packages/physicalai-rebot-b601-plugin/examples/runtime/move-joints-dm.yaml
#
# Use with the arm suspended or in a safe configuration — the arm will move!

runtime:
  robot:
    class_path: physicalai_rebot_b601_plugin.dm.ReBotB601DM
    init_args:
      port: /dev/ttyACM0 # CHANGE_ME: follower serial port (or CAN channel)
      can_adapter: damiao # damiao | socketcan
      # POS_VEL / FORCE_POS (default) provides conservative velocity- and
      # force-limited control. Switch both modes to mit only after validating
      # the gains for this arm.
      control_mode: pos_vel # pos_vel | mit
      gripper_control_mode: force_pos # force_pos | mit

  action_source:
    class_path: physicalai_rebot_b601_plugin.motion.SineWaveSource
    init_args:
      amplitude: 10 # degrees
      frequency: 0.25 # Hz

  fps: 20

run:
  duration_s: 10
