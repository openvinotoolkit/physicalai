[build-system]
requires = ["hatchling<1.30", "hatch-vcs"]  # cap <1.30: hatchling>=1.30 emits Metadata 2.5, rejected by PyPI/twine (pypi/warehouse#19083)
build-backend = "hatchling.build"

[project]
name = "physicalai-mujoco-so101-plugin"
dynamic = ["version"]
description = "MuJoCo SO-101 simulation plugin for PhysicalAI Studio"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "physicalai[transport]>=0.2.0,<1.0",
    "physicalai-studio-plugin>=0.2.0",
    "numpy>=1.24",
    "mujoco>=3.6.0",
    "loguru>=0.7",
    "pyfakewebcam>=0.1.0; sys_platform == 'linux'",
    "pydantic>=2.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opencv-python-headless>=4.10",
    # 0.0.x with no stability promise, and the viser sync reaches into
    # ViserMujocoScene internals; pin the patch range deliberately.
    "mjviser>=0.0.14,<0.1",
]

[project.optional-dependencies]
tests = ["pytest", "pytest-asyncio", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/openvinotoolkit/physicalai"
Repository = "https://github.com/openvinotoolkit/physicalai"
Issues = "https://github.com/openvinotoolkit/physicalai/issues"

[project.entry-points."physicalai.studio.catalog_plugins"]
mujoco-so101 = "physicalai_mujoco_so101_plugin.studio_catalog:register_physicalai_studio_plugin"

[project.scripts]
physicalai-mujoco-so101 = "physicalai_mujoco_so101_plugin.__main__:main"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^physicalai-mujoco-so101-plugin-v(?P<version>\d+(?:\.\d+)*)$'
raw-options = { search_parent_directories = true, git_describe_command = "git describe --dirty --tags --long --match physicalai-mujoco-so101-plugin-v*", fallback_version = "0.3.1" }

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_mujoco_so101_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"urdf" = "physicalai_mujoco_so101_plugin/urdf"
"NOTICE" = "physicalai_mujoco_so101_plugin/NOTICE"

[tool.hatch.build.targets.sdist]
include = [
    "src/physicalai_mujoco_so101_plugin/**",
    "urdf/**",
    "README.md",
    "pyproject.toml",
    "LICENSE",
    "NOTICE",
]
exclude = [
    "examples/**",
]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
